version: 2

models:
  - name: fct_orders
    description: "Fact table containing processed customer orders. One row per order."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Foreign key to dim_customers."
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_date
        description: "Date the order was placed."
        tests:
          - not_null