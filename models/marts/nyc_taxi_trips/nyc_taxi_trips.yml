version: 2

models:
  - name: nyc_taxi_trips
    description: "Customer taxi trips. One record per trip"
    config:
      access: public
    columns:
      - name: vendorName
        description: "Name of The Vendor"
        data_type: varchar(50)
        tests:
          - not_null
      - name: lpep_pickup_datetime
        description: "The pick-up timestamp"
        data_type: timestamp
        tests:
          - not_null 
      - name: lpep_dropoff_datetime
        description: "The drop-off timestamp"
        data_type: timestamp
        tests:
          - not_null 
      - name: store_and_fwd_flag
        description: "Store & Forward flag"
        data_type: boolean
      - name: rate
        description: "Charge Rate"
        data_type: varchar(20)
        tests:
          - not_null
      - name: pickupZone
        description: "Journey start Zone"
        data_type: varchar(30)
      - name: pickupBorough
        description: "Jouney start borough"
        data_type: varchar(30)
      - name: dropoffZone
        description: "Journey end Zone"
        data_type: varchar(30)
      - name: dropoffBorough
        description: "Jouney end borough"
        data_type: varchar(30)
      - name: passenger_count
        description: "Number of Passengers"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: trip_distance
        description: "Trip Distance"
        data_type: number(5,2)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                inclusive: true
      - name: fare_amount
        description: "Fare Amount"
        data_type: number(5,2)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: extra
        description: "Extras Amount"
        data_type: number(5,2)
      - name: mta_tax
        description: "Taxes"
        data_type: number(5,2)
      - name: tip_amount
        description: Tip Amount"
        data_type: number(5,2)
      - name: tolls_amount
        description: "Tolls Amount"
        data_type: number(5,2)
      - name: improvement_surcharge
        description: "Improvement Surcharge"
        data_type: number(5,2)
      - name: total_amount
        description: "Total Amount"
        data_type: number(5,2)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: paymentType
        description: "Payment Type"
        data_type: varchar(15)
        tests:
          - not_null
      - name: tripType
        description: "Type of Trip"
        data_type: varchar(15)
        tests:
          - not_null
