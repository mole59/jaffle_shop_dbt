version: 2

models:
  - name: nyc_taxi_trips
    description: "Customer taxi trips. One record per trip"
    columns:
      - name: vendorName
        description: "NAme of The Vendor"
        tests:
          - not_null
      - name: lpep_pickup_datetime
        description: "The pick-up timestamp"
        tests:
          - not_null 
      - name: lpep_dropoff_datetime
        description: "The drop-off timestamp"
        tests:
          - not_null 
      - name: store_and_fwd_flag
        description: "Store & Forward flag"
      - name: rate
        description: "Charge Rate"
        tests:
          - not_null
      - name: pulocationid
        description: "Pick-up Location"
        tests:
          - not_null 
      - name: dolocationid
        description: "Drop-off Location"
        tests:
          - not_null
      - name: passenger_count
        description: "Number of Passengers"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: trip_distance
        description: "Trip Distance"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                inclusive: true
      - name: fare_amount
        description: "Fare Amount"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: extra
        description: "Extras Amount"
      - name: mta_tax
        description: "Taxes"
      - name: tip_amount
        description: Tip Amount"
      - name: tolls_amount
        description: "Tolls Amount"
      - name: improvement_surcharge
        description: "Improvement Surcharge"
      - name: total_amount
        description: "Total Amount"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: paymentType
        description: "Payment Type"
        tests:
          - not_null
      - name: tripType
        description: "Type of Trip"
        tests:
          - not_null
