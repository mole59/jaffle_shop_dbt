version: 2

groups:
  - name: nyc_taxi_success
    owner:
      name: New York Taxi Team
      email: michael.morris@comsolve

models:
  - name: nyc_taxi_trips
    description: "Customer taxi trips. One record per trip"
    config:
      contract: 
        enforced: true
      group: nyc_taxi_success
      access: public
    columns:
      - name: vendorName
        description: "Name of The Vendor"
        data_type: STRING(40)
        tests:
          - not_null
      - name: pickupDatetime
        description: "The pick-up timestamp"
        data_type: TIMESTAMP
        tests:
          - not_null 
      - name: dropoffDateTime
        description: "The drop-off timestamp"
        data_type: TIMESTAMP
        tests:
          - not_null 
      - name: storeAndForwardFlag
        description: "Store & Forward flag"
        data_type: BOOL
      - name: rate
        description: "Charge Rate"
        data_type: STRING(20)
        tests:
          - not_null
      - name: pickupZone
        description: "Journey start Zone"
        data_type: STRING(40)
      - name: pickupBorough
        description: "Jouney start borough"
        data_type: STRING(40)
      - name: dropoffZone
        description: "Journey end Zone"
        data_type: STRING(40)
      - name: dropoffBorough
        description: "Jouney end borough"
        data_type: STRING(40)
      - name: passengerCount
        description: "Number of Passengers"
        data_type: INT64
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: tripDistance
        description: "Trip Distance"
        data_type: NUMERIC(5,2)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                inclusive: true
      - name: fareAmount
        description: "Fare Amount"
        data_type: NUMERIC(5,2)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: extra
        description: "Extras Amount"
        data_type: NUMERIC(5,2)
      - name: mtaTax
        description: "Taxes"
        data_type: NUMERIC(5,2)
      - name: tipAmount
        description: Tip Amount"
        data_type: NUMERIC(5,2)
      - name: tollsAmount
        description: "Tolls Amount"
        data_type: NUMERIC(5,2)
      - name: improvementSurcharge
        description: "Improvement Surcharge"
        data_type: NUMERIC(5,2)
      - name: totalAmount
        description: "Total Amount"
        data_type: NUMERIC(5,2)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: paymentType
        description: "Payment Type"
        data_type: STRING(20)
        tests:
          - not_null
      - name: tripType
        description: "Type of Trip"
        data_type: STRING(20)
        tests:
          - not_null
