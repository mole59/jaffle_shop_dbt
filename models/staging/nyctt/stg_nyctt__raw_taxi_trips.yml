models:
  - name: stg_nyctt__raw_taxi_trips
    description: Single taxi trips
    columns:
      - name: vendorId
        description: "The Vendor ID"
        data_tests:
          - not_null
      - name: pickupDatetime
        description: "The pick-up timestamp"
        data_tests:
          - not_null 
      - name: dropoffDateTime
        description: "The drop-off timestamp"
        data_tests:
          - not_null 
      - name: storeAndForwardFlag
        description: "Store & Forward flag"
      - name: rateCodeId
        description: "Rate Code ID"
        data_tests:
          - not_null
      - name: pickupLocationId
        description: "Pick-up Location"
        data_tests:
          - not_null 
      - name: dropoffLocationId
        description: "Drop-off Location"
        data_tests:
          - not_null
      - name: passengerCount
        description: "Number of Passengers"
        data_tests:
          - not_null
      - name: tripDistance
        description: "Trip Distance"
        data_tests:
          - not_null
      - name: fareAmount
        description: "Fare Amount"
        data_tests:
          - not_null
      - name: extra
        description: "Extras Amount"
      - name: mtaTax
        description: "Taxes"
      - name: tipAmount
        description: Tip Amount"
      - name: tollsAmount
        description: "Tolls Amount"
      - name: improvementSurcharge
        description: "Improvement Surcharge"
      - name: totalAmount
        description: "Total Amount"
        data_tests:
          - not_null
      - name: paymentType
        description: "Payment Type ID"
        data_tests:
          - not_null
      - name: tripType
        description: "Trip Type ID"
        data_tests:
          - not_null
