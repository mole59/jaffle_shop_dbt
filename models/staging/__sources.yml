version: 2

sources:
  - name: ecom
    schema: Jaffle_Shop
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: customers
        description: One record per person who has purchased one or more items
      - name: orders
        description: One record per order (consisting of one or more order items)
        config:
          loaded_at_field: ordered_at
      - name: items
        description: Items included in an order
      - name: stores
        description: One record per store
      - name: products
        description: One record per SKU for items sold in stores
      - name: supplies
        description: One record per supply per SKU of items sold in stores

  - name: nyctt
    schema: nyc_taxi_src
    description: Taxi trip data 
    tables:
      - name: raw_454_calendar
        description: Calendar
      - name: raw_taxi_zones
        description: Taxi zones in New  York City 
      - name: raw_taxi_trips
        description: Customer taxi trips

  - name: nyctts
    schema: nyc_taxi_seeds
    description: Static Taxi trip data 
    tables:
      - name: raw_vendors
        description: Vendor Information
      - name: raw_trip_types
        description: Trip Types
