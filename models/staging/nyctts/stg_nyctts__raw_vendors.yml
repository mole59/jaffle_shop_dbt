models:
  - name: stg_nyctts__raw_vendors
    description: Vendor codes and their descriptions
    columns:
      - name: VendorID
        description: Vendor ID 
        data_tests:
          - unique
          - not_null
      - name: name 
        description: Vendor Name
        data_tests:
          - not_null
      - name: Location 
        description: City Location
        data_tests:
          - not_null
